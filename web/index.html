<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23f35e16'/><path d='M30 40 L50 25 L70 40 L70 70 L30 70 Z' fill='white'/><circle cx='50' cy='52' r='14' fill='%230a0d14'/><circle cx='50' cy='52' r='9' fill='%23f35e16'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sony ARW 创意外观工具 · FL2 / FL3</title>
    <meta name="description" content="纯前端索尼 RAW 创意外观注入与色彩矩阵调校工具，支持 FL2 / FL3 等全套预设，本地内存处理，支持移动端与桌面端访问。" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sony_arw_theme');
          var pref = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          var theme = saved || pref;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
